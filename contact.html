<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="space" aria-hidden="true"><canvas></canvas></div>

    <header class="site-header">
        <div class="wrap">
            <a class="logo" href="index.html" aria-label="KillaMeep, home"><span class="tilde">~/</span>killameep<span class="cursor" aria-hidden="true"></span></a>
            <nav class="nav" aria-label="Main">
                <a href="index.html">home</a>
                <a href="about.html">about</a>
                <a href="projects.html">projects</a>
                <a href="contact.html" aria-current="page">contact</a>
            </nav>
        </div>
    </header>

    <main id="main">
        <div class="wrap page">
            <header class="reveal">
                <p class="eyebrow">contact</p>
                <h1 class="page-title">Let's <span class="grad-text">talk</span>.</h1>
                <p class="lede">Project idea, question, or just saying hi: email is the fastest way to reach me.</p>
            </header>
            <div class="contact-grid">
                <div class="card glow contact-card reveal">
                    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
                    <span class="label">email</span>
                    <a class="value inline-link" href="mailto:nathanrfeldt@gmail.com">nathanrfeldt@gmail.com</a>
                    <div class="row">
                        <a class="btn btn-primary" href="mailto:nathanrfeldt@gmail.com">Write an email</a>
                        <button class="btn" type="button" data-copy="nathanrfeldt@gmail.com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg> <span>Copy</span></button>
                    </div>
                </div>
                <div class="card glow contact-card reveal" style="--d: .08s">
                    <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg></span>
                    <span class="label">github</span>
                    <a class="value inline-link" href="https://github.com/KillaMeep" target="_blank" rel="noopener">github.com/KillaMeep</a>
                    <div class="row">
                        <a class="btn" href="https://github.com/KillaMeep" target="_blank" rel="noopener">View profile <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>&copy; <span data-year>2026</span> <a class="secret-link" href="hidden.html">KillaMeep</a></p>
            <div class="footer-links">
                <a href="https://github.com/KillaMeep" target="_blank" rel="noopener">github</a>
                <a href="mailto:nathanrfeldt@gmail.com">email</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/site.js"></script>
    <script>
        document.querySelectorAll('[data-copy]').forEach(btn => {
            btn.addEventListener('click', async () => {
                const label = btn.querySelector('span');
                try {
                    await navigator.clipboard.writeText(btn.dataset.copy);
                    label.textContent = 'Copied';
                } catch {
                    label.textContent = 'Copy failed';
                }
                setTimeout(() => { label.textContent = 'Copy'; }, 1800);
            });
        });
    </script>
</body>
</html>
