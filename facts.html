<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useless Facts | KillaMeep</title>
    <meta name="description" content="Random useless facts. Some are crude.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07060d">
    <meta property="og:title" content="Useless Facts | KillaMeep">
    <meta property="og:description" content="Random useless facts. Some are crude.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307060d'/%3E%3Cpath d='M16 5c.9 6.1 4.9 10.1 11 11-6.1.9-10.1 4.9-11 11-.9-6.1-4.9-10.1-11-11 6.1-.9 10.1-4.9 11-11Z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="space" aria-hidden="true"><canvas></canvas></div>

    <header class="site-header">
        <div class="wrap">
            <a class="logo" href="index.html" aria-label="KillaMeep, home"><span class="tilde">~/</span>killameep</a>
            <nav class="nav" aria-label="Main">
                <a href="index.html">home</a>
                <a href="about.html">about</a>
                <a href="projects.html">projects</a>
                <a href="contact.html">contact</a>
            </nav>
        </div>
    </header>

    <main id="main">
        <div class="wrap page">
            <section class="toy">
                <header class="reveal">
                    <p class="eyebrow">knowledge you did not need</p>
                    <h1 class="page-title">Useless <span class="grad-text">facts</span>.</h1>
                </header>
                <div class="card toy-stage reveal is-loading" style="--d: .08s; min-height: 220px" id="stage" aria-live="polite" aria-busy="true">
                    <p class="fact" id="fact">Loading a fact...</p>
                </div>
                <p class="status" id="status"></p>
                <div class="toy-actions reveal" style="--d: .12s">
                    <button class="btn btn-primary" type="button" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg> Another one</button>
                </div>
            </section>
        </div>

        <div class="modal" id="age-check" role="dialog" aria-modal="true" aria-labelledby="age-title" hidden>
            <div class="card">
                <h2 id="age-title">Are you over 18?</h2>
                <p>Some of these facts can be crude.</p>
                <div class="toy-actions">
                    <button class="btn btn-primary" type="button" data-age="yes">Yes</button>
                    <button class="btn" type="button" data-age="no">No</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>&copy; <span data-year>2026</span> <a class="secret-link" href="hidden.html">KillaMeep</a></p>
            <div class="footer-links">
                <a href="https://github.com/KillaMeep" target="_blank" rel="noopener">github</a>
                <a href="https://discordapp.com/users/247075046659457024" target="_blank" rel="noopener">discord</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/site.js"></script>
    <script>
        const stage = document.getElementById('stage');
        const factEl = document.getElementById('fact');
        const next = document.getElementById('next');
        const status = document.getElementById('status');
        const modal = document.getElementById('age-check');

        const store = {
            get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
        };

        const fetchFact = async () => {
            stage.classList.add('is-loading');
            stage.setAttribute('aria-busy', 'true');
            next.disabled = true;
            status.textContent = '';
            try {
                const res = await fetch('https://uselessfacts.jsph.pl/api/v2/facts/random?language=en');
                const data = await res.json();
                factEl.textContent = data.text;
            } catch {
                status.textContent = 'Could not reach the fact machine. Try again in a moment.';
            } finally {
                stage.classList.remove('is-loading');
                stage.setAttribute('aria-busy', 'false');
                next.disabled = false;
            }
        };

        next.addEventListener('click', fetchFact);
        modal.querySelectorAll('[data-age]').forEach(btn => {
            btn.addEventListener('click', () => {
                const adult = btn.dataset.age === 'yes';
                store.set('isOver18', adult);
                if (!adult) { window.location.href = 'hidden.html'; return; }
                modal.hidden = true;
                fetchFact();
            });
        });

        if (store.get('isOver18') === 'true') {
            fetchFact();
        } else {
            modal.hidden = false;
            modal.querySelector('[data-age="yes"]').focus();
        }
    </script>
</body>
</html>
