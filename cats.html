<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#07060d">
    <meta property="og:title" content="Cute Cats | KillaMeep">
    <meta property="og:description" content="A fresh random cat, every click.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307060d'/%3E%3Cpath d='M16 5c.9 6.1 4.9 10.1 11 11-6.1.9-10.1 4.9-11 11-.9-6.1-4.9-10.1-11-11 6.1-.9 10.1-4.9 11-11Z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/css/site.css?v=2">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="space" aria-hidden="true"><canvas></canvas></div>

    <header class="site-header">
        <div class="wrap">
            <a class="logo" href="index.html" aria-label="KillaMeep, home"><span class="tilde">~/</span>killameep</a>
            <nav class="nav" aria-label="Main">
                <a href="index.html">home</a>
                <a href="about.html">about</a>
                <a href="projects.html">projects</a>
                <a href="contact.html">contact</a>
            </nav>
        </div>
    </header>

    <main id="main">
        <div class="wrap page">
            <section class="toy">
                <header class="reveal">
                    <p class="eyebrow">you chose wisely</p>
                    <h1 class="page-title">Cute <span class="grad-text">cats</span>.</h1>
                    <p class="lede">A fresh random cat, every click.</p>
                </header>
                <div class="card toy-stage reveal is-loading" style="--d: .08s" id="stage" aria-live="polite" aria-busy="true">
                    <img id="pet" alt="A random cat" width="600" height="400">
                </div>
                <p class="status" id="status"></p>
                <div class="toy-actions reveal" style="--d: .12s">
                    <button class="btn btn-primary" type="button" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg> New cat</button>
                    <a class="btn" href="choose.html">Change my answer</a>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>&copy; <span data-year>2026</span> <a class="secret-link" href="hidden.html">KillaMeep</a></p>
            <div class="footer-links">
                <a href="https://github.com/KillaMeep" target="_blank" rel="noopener">github</a>
                <a href="https://discordapp.com/users/247075046659457024" target="_blank" rel="noopener">discord</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/site.js?v=2"></script>
    <script>
        const stage = document.getElementById('stage');
        const img = document.getElementById('pet');
        const next = document.getElementById('next');
        const status = document.getElementById('status');
        const setLoading = (on) => {
            stage.classList.toggle('is-loading', on);
            stage.setAttribute('aria-busy', on);
            next.disabled = on;
        };
        img.addEventListener('load', () => setLoading(false));
        img.addEventListener('error', () => { setLoading(false); status.textContent = 'That one got lost in space. Try again.'; });
        const fetchPet = async () => {
            setLoading(true);
            status.textContent = '';
            try {
                const res = await fetch('https://api.thecatapi.com/v1/images/search');
                const data = await res.json();
                img.src = data[0].url;
            } catch {
                setLoading(false);
                status.textContent = 'Could not reach the API. Try again in a moment.';
            }
        };
        next.addEventListener('click', fetchPet);
        fetchPet();
    </script>
</body>
</html>
